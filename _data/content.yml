  last_name: "Hassen"
  cv_url: "/assets/resources/Riyad_Hassen_PhD_CV.pdf"
  tagline: "MSc Computer Sciences, UW–Madison"
  subtitle: >
    My research interests lie at the intersection of computer vision and natural language processing, with a focus on multimodal reasoning in vision-language models, multilingual large language models (LLMs),
    and efficient LLM architectures. My previous work includes applied computer vision for medical imaging, 3d vision, RAG and VLMs. 
    I am also interested in advancing low-resource language technologies, retrieval systems, and agentic AI. 
    

