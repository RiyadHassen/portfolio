      I'm a <strong>graduate ML researcher and engineer</strong>  recently completing my MSc in Computer Sciences at the University of
      Wisconsin–Madison. My work spans Vision-Language Models, retrieval-augmented
      generation, and hybrid Transformer/state-space architectures, with a growing
      focus on multilingual and low-resource language technologies.
